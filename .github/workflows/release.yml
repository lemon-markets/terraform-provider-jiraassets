# Builds, signs and publishes a "v*" tag to the Scalr private provider registry.
name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Signing secrets and the Scalr OIDC trust are scoped to this environment.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          # Avoid a cache poisoned by other workflows leaking into signed builds.
          cache: false
      - name: Build and sign
        env:
          CGO_ENABLED: "0"
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
        # GoReleaser is pinned in tools/goreleaser/go.mod so Dependabot bumps it.
        run: |
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          install -d -m 700 "$GNUPGHOME"
          gpg --batch --import <<<"$GPG_PRIVATE_KEY"
          GPG_FINGERPRINT=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          export GPG_FINGERPRINT
          (cd tools/goreleaser && go build -o "${RUNNER_TEMP}/goreleaser" github.com/goreleaser/goreleaser/v2)
          "${RUNNER_TEMP}/goreleaser" release --clean

      - name: Package release tarball
        run: |
          mkdir pkg
          cp dist/*.zip dist/*_SHA256SUMS dist/*_SHA256SUMS.sig pkg/
          cp terraform-registry-manifest.json README.md CHANGELOG.md pkg/
          # Scalr rejects unknown top-level entries, so no leading "./".
          (cd pkg && tar -czf ../release.tar.gz -- *)
          tar -tzf release.tar.gz

      - name: Publish to Scalr
        env:
          SCALR_HOSTNAME: ${{ vars.SCALR_HOSTNAME }}
          SCALR_SERVICE_ACCOUNT: ${{ vars.SCALR_SERVICE_ACCOUNT }}
          SCALR_PROVIDER_ID: ${{ vars.SCALR_PROVIDER_ID }}
          SCALR_GPG_KEY_ID: ${{ vars.SCALR_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          api="https://${SCALR_HOSTNAME}/api/iacp/v3"

          id_token=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${SCALR_HOSTNAME}" | jq -r .value)
          token=$(jq -n --arg e "$SCALR_SERVICE_ACCOUNT" --arg t "$id_token" \
              '{"service-account-email": $e, "id-token": $t}' |
            curl -fsS -X POST -H 'Content-Type: application/json' --data @- \
              "${api}/service-accounts/assume" | jq -r '."access-token"')
          echo "::add-mask::${token}"

          version=$(jq -n --arg v "${GITHUB_REF_NAME#v}" --arg p "$SCALR_PROVIDER_ID" --arg g "$SCALR_GPG_KEY_ID" '{data: {
              type: "provider-versions",
              attributes: {version: $v},
              relationships: {
                provider: {data: {type: "providers", id: $p}},
                "gpg-key": {data: {type: "gpg-keys", id: $g}}}}}' |
            curl -fsS -X POST -H "Authorization: Bearer ${token}" \
              -H 'Content-Type: application/vnd.api+json' --data @- "${api}/provider-versions")
          id=$(jq -r .data.id <<<"$version")
          upload=$(jq -r .data.links.upload <<<"$version")

          curl -fsS -X PUT --upload-file release.tar.gz "$upload"

          for _ in $(seq 60); do
            attrs=$(curl -fsS -H "Authorization: Bearer ${token}" "${api}/provider-versions/${id}" | jq .data.attributes)
            case $(jq -r .status <<<"$attrs") in
              uploaded) echo "Published ${GITHUB_REF_NAME} as ${id}"; exit 0 ;;
              errored) echo "::error::$(jq -r '."error-message"' <<<"$attrs")"; exit 1 ;;
            esac
            sleep 5
          done
          echo "::error::${id} still pending after 5 minutes"; exit 1
