# Visit https://goreleaser.com for documentation on how to customize this
# behavior.
version: 2
builds:
- env:
    # goreleaser does not work with CGO, it could also complicate
    # usage by users in CI/CD systems like HCP Terraform where
    # they are unable to install libraries.
    - CGO_ENABLED=0
  mod_timestamp: '{{ .CommitTimestamp }}'
  flags:
    - -trimpath
  ldflags:
    - '-s -w -X main.version={{.Version}} -X main.commit={{.Commit}}'
  goos:
    - linux
    - darwin
  goarch:
    - amd64
    - arm64
  ignore:
    - goos: darwin
      goarch: amd64
  binary: '{{ .ProjectName }}_v{{ .Version }}'
archives:
- formats:
  - zip
  name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
  # Scalr rejects zips containing anything but the binary.
  files:
    - none*
checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256
signs:
  - artifacts: checksum
    # Passphrase goes to gpg on stdin; loopback stops gpg prompting via pinentry.
    stdin: '{{ .Env.PASSPHRASE }}'
    args:
      - "--batch"
      - "--pinentry-mode"
      - "loopback"
      - "--passphrase-fd"
      - "0"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
# Published to the Scalr registry by the release workflow, not GitHub.
release:
  disable: true
changelog:
  disable: true
